# Legilimens — Nginx Reverse Proxy
# Routes:
#   /api/*       → FastAPI backend (8001)   [REST]
#   /ws/*        → FastAPI backend (8001)   [WebSocket upgrade]
#   /*           → Next.js frontend (3000)
#
# Replace YOUR_DOMAIN with your actual domain or Droplet IP.

events {
    worker_connections 1024;
}

http {
    # ─── Logging ──────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ─── Security headers ─────────────────────────────────────────────
    add_header X-Frame-Options         "SAMEORIGIN"   always;
    add_header X-Content-Type-Options  "nosniff"      always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ─── Gzip ─────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # ─── Upstream definitions ─────────────────────────────────────────
    upstream backend {
        server fastapi:8001;
        keepalive 32;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    # ─── HTTP → redirect to HTTPS (comment out if no SSL yet) ─────────
    # server {
    #     listen 80;
    #     server_name YOUR_DOMAIN;
    #     return 301 https://$host$request_uri;
    # }

    # ─── Main server block ────────────────────────────────────────────
    server {
        listen 80;
        # listen 443 ssl;                        # uncomment after adding SSL
        server_name _;                           # catch-all; set to YOUR_DOMAIN in prod

        client_max_body_size 50M;                # allow large audio uploads
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;

        # SSL (uncomment after `certbot --nginx`)
        # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        # ssl_protocols       TLSv1.2 TLSv1.3;
        # ssl_ciphers         HIGH:!aNULL:!MD5;

        # ─── FastAPI REST & Docs ──────────────────────────────────────
        location ~ ^/(health|docs|redoc|openapi|auth|asr|retrieval|analytics|recording|transcription)(/.*)?$ {
            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        # ─── WebSocket endpoints ──────────────────────────────────────
        location /ws/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 86400s;           # keep WS alive for full lecture
        }

        # ─── Next.js frontend (everything else) ──────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            # Next.js hot-reload WebSocket (dev only — harmless in prod)
            proxy_set_header   Upgrade    $http_upgrade;
        }
    }
}
