# Legilimens — Docker Compose (on-prem school server)
# Brings up: Actian VectorAI DB + Actian Vector Analytics + FastAPI + Next.js frontend.
#
# For DigitalOcean deployment (cloud-only, no Actian containers),
# use `do.app.yaml` or `docker-compose.prod.yml`.
#
# Actian VectorAI DB: actian/vectorai:latest (Community Edition with 30-day trial)
#   - REST on 6573, gRPC on 6574, LocalUI on 6575
# Actian Vector: actian/vector5.0:community (columnar SQL)

services:
  # ───────────────────────────────────────────────────────────────
  # Actian VectorAI DB — the retrieval brain (on-prem, air-gapped)
  # ───────────────────────────────────────────────────────────────
  vectorai-db:
    image: actian/vectorai:latest
    container_name: legilimens-vectorai
    ports:
      - "6573:6573"
      - "6574:6574"
      - "6575:6575"
    environment:
      - ACTIAN_VECTORAI_ACCEPT_EULA=YES
      - ACTIAN_VECTORAI_LICENSE_KEY=${ACTIAN_LICENSE_KEY:-***REDACTED_ACTIAN_LICENSE_KEY***}
    volumes:
      - vectorai-data:/var/lib/actian-vectorai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6573/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ───────────────────────────────────────────────────────────────
  # Actian Vector (Analytics Engine) — columnar SQL for confusion
  # ───────────────────────────────────────────────────────────────
  actian-vector:
    image: actian/vector5.0:community
    container_name: legilimens-vector
    profiles:
      - onprem
    ports:
      - "5432:5432"
    volumes:
      - vector-data:/actian/vector/data
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────
  # FastAPI orchestrator — WebSocket hub + REST + retrieval
  # ───────────────────────────────────────────────────────────────
  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legilimens-fastapi
    depends_on:
      vectorai-db:
        condition: service_healthy
    environment:
      VECTORAI_HOST: vectorai-db
      VECTORAI_PORT: "6574"
      VECTOR_HOST: actian-vector
      VECTOR_PORT: "5432"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
    env_file:
      - .env
    ports:
      - "8001:8001"
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────
  # Next.js Frontend — teacher dashboard + student PWA
  # ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8001
    container_name: legilimens-frontend
    ports:
      - "3000:3000"
    depends_on:
      - fastapi
    restart: unless-stopped

volumes:
  vectorai-data:
  vector-data:
