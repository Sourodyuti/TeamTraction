# Legilimens — Docker Compose
# Brings up: Actian VectorAI DB (on-prem retrieval) + Actian Vector Community (columnar analytics) + FastAPI orchestrator.
#
# Actian VectorAI DB: actian/vectorai:latest (Community Edition with 30-day trial)
#   - REST on 6573, gRPC on 6574, LocalUI on 6575
#   - License key: ***REDACTED_ACTIAN_LICENSE_KEY***
# Actian Vector: actian/vector5.0:community (columnar SQL)

services:
  # ───────────────────────────────────────────────────────────────
  # Actian VectorAI DB — the retrieval brain (on-prem, air-gapped-capable)
  # REST on 6573, gRPC on 6574, LocalUI on 6575
  # ───────────────────────────────────────────────────────────────
  vectorai-db:
    image: actian/vectorai:latest
    container_name: legilimens-vectorai
    ports:
      - "6573:6573"   # REST API
      - "6574:6574"   # gRPC (Python SDK default)
      - "6575:6575"   # LocalUI (http://localhost:6575)
    environment:
      - ACTIAN_VECTORAI_ACCEPT_EULA=YES
      - ACTIAN_VECTORAI_LICENSE_KEY=***REDACTED_ACTIAN_LICENSE_KEY***
    volumes:
      - vectorai-data:/var/lib/actian-vectorai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6573/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ───────────────────────────────────────────────────────────────
  # Actian Vector (Analytics Engine) — columnar SQL for confusion time-series.
  # Community image per blueprint.
  # ───────────────────────────────────────────────────────────────
  actian-vector:
    image: actian/vector5.0:community
    container_name: legilimens-vector
    ports:
      # Default SQL access port for Actian Vector
      - "5432:5432"
    volumes:
      - vector-data:/actian/vector/data
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────
  # FastAPI orchestrator — WebSocket hub + REST + retrieval/analytics.
  # Runs the app from ./backend via uvicorn.
  # ───────────────────────────────────────────────────────────────
  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legilimens-fastapi
    depends_on:
      vectorai-db:
        condition: service_healthy
      actian-vector:
        condition: service_started
    environment:
      VECTORAI_HOST: vectorai-db
      VECTORAI_PORT: "6574"
      VECTOR_HOST: actian-vector
      VECTOR_PORT: "5432"
      # GEMINI_API_KEY / ELEVENLABS_API_KEY loaded from .env
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # Dev: live-reload the backend source
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

volumes:
  vectorai-data:
  vector-data: