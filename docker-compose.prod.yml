# Legilimens — Production Docker Compose (DigitalOcean Droplet)
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Architecture:
#   nginx (80/443) → frontend (3000) + backend (8001)
#   vectorai-db (6573/6574)
#   actian-vector (5432)
#   All secrets from .env.prod (never committed)

services:
  # ─── Reverse proxy ────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: legilimens-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro        # mount Let's Encrypt certs here
      - nginx-logs:/var/log/nginx
    depends_on:
      - frontend
      - fastapi
    restart: unless-stopped

  # ─── Next.js Frontend ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Point the frontend at the public-facing backend URL
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
    container_name: legilimens-frontend
    environment:
      NODE_ENV: production
      PORT: "3000"
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 20s
      timeout: 10s
      retries: 3

  # ─── FastAPI Backend ───────────────────────────────────────────────
  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legilimens-fastapi
    env_file:
      - .env.prod                             # production secrets
    environment:
      VECTORAI_HOST: vectorai-db
      VECTORAI_PORT: "6574"
      VECTOR_HOST: actian-vector
      VECTOR_PORT: "5432"
    expose:
      - "8001"
    depends_on:
      vectorai-db:
        condition: service_healthy
      actian-vector:
        condition: service_started
    volumes:
      - backend-recordings:/app/recordings    # persist lecture audio
    restart: unless-stopped

  # ─── Actian VectorAI DB ───────────────────────────────────────────
  vectorai-db:
    image: actian/vectorai:latest
    container_name: legilimens-vectorai
    expose:
      - "6573"
      - "6574"
    environment:
      - ACTIAN_VECTORAI_ACCEPT_EULA=YES
      - ACTIAN_VECTORAI_LICENSE_KEY=${ACTIAN_VECTORAI_LICENSE_KEY:-***REDACTED_ACTIAN_LICENSE_KEY***}
    volumes:
      - vectorai-data:/var/lib/actian-vectorai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6573/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── Actian Vector SQL ────────────────────────────────────────────
  actian-vector:
    image: actian/vector5.0:community
    container_name: legilimens-vector
    expose:
      - "5432"
    volumes:
      - vector-data:/actian/vector/data
    restart: unless-stopped

volumes:
  vectorai-data:
  vector-data:
  backend-recordings:
  nginx-logs:
