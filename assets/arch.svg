<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a" />
      <stop offset="50%" stop-color="#141a30" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Node Gradient (Ancient Parchment/Gold) -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3b5c" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff4cd" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa7c11" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5" />
    </filter>

    <!-- Moving Sparkle for Data Paths -->
    <g id="dataSpark">
      <circle r="4" fill="#849eff" filter="url(#glow)">
        <animate attributeName="opacity" values="0.3; 1; 0.3" dur="1.5s" repeatCount="indefinite" />
        <animateTransform attributeName="transform" type="scale" values="0.8; 1.5; 0.8" dur="1s" repeatCount="indefinite" />
      </circle>
    </g>
  </defs>

  <rect width="1000" height="900" fill="url(#bgGrad)" rx="20" stroke="#3a4b7c" stroke-width="4" />

  <!-- Paths / Connections -->
  <g stroke="#3a4b7c" stroke-width="3" stroke-dasharray="6,4" fill="none" filter="url(#glow)" opacity="0.6">
    <!-- Edge to Vault -->
    <path d="M 250 140 L 450 300" /> <!-- Phone to FastAPI -->
    <path d="M 750 140 L 800 300" /> <!-- Mic to Embedder -->
    
    <!-- Vault Internal -->
    <path d="M 800 360 L 700 450" /> <!-- Embedder to Actian DB -->
    <path d="M 450 360 L 700 450" /> <!-- FastAPI to Actian DB -->
    <path d="M 450 360 L 300 450" /> <!-- FastAPI to Analytics -->
    
    <!-- Vault to Cloud -->
    <path d="M 450 360 L 300 650" /> <!-- FastAPI to Gemini -->
    <path d="M 450 360 L 700 650" /> <!-- FastAPI to ElevenLabs -->
    
    <!-- ElevenLabs to Phone -->
    <path d="M 700 650 Q -100 650 250 140" stroke="#d4af37" stroke-dasharray="12,6" opacity="0.8" />
    
    <!-- Vault to Dashboard -->
    <path d="M 450 360 L 300 800" /> <!-- FastAPI to Radar -->
    <path d="M 300 520 L 700 800" /> <!-- Analytics to Pensieve -->
  </g>

  <!-- Animated Data Packets along Paths -->
  <use href="#dataSpark"><animateMotion dur="2s" repeatCount="indefinite" path="M 250 140 L 450 300" /></use>
  <use href="#dataSpark"><animateMotion dur="2.5s" repeatCount="indefinite" path="M 750 140 L 800 300" /></use>
  <use href="#dataSpark"><animateMotion dur="1.5s" repeatCount="indefinite" path="M 800 360 L 700 450" /></use>
  <use href="#dataSpark"><animateMotion dur="2s" repeatCount="indefinite" path="M 450 360 L 700 450" /></use>
  <use href="#dataSpark"><animateMotion dur="2s" repeatCount="indefinite" path="M 700 450 L 450 360" /></use>
  <use href="#dataSpark"><animateMotion dur="1.8s" repeatCount="indefinite" path="M 450 360 L 300 450" /></use>
  
  <use href="#dataSpark"><animateMotion dur="2s" repeatCount="indefinite" path="M 450 360 L 300 650" /></use>
  <use href="#dataSpark"><animateMotion dur="2s" repeatCount="indefinite" path="M 300 650 L 450 360" /></use>
  <use href="#dataSpark"><animateMotion dur="2s" repeatCount="indefinite" path="M 450 360 L 700 650" /></use>
  <use href="#dataSpark" fill="#d4af37"><animateMotion dur="3s" repeatCount="indefinite" path="M 700 650 Q -100 650 250 140" /></use>

  <use href="#dataSpark"><animateMotion dur="2.5s" repeatCount="indefinite" path="M 450 360 L 300 800" /></use>
  <use href="#dataSpark"><animateMotion dur="2.5s" repeatCount="indefinite" path="M 300 520 L 700 800" /></use>

  <!-- ================= NODES ================= -->

  <!-- Layer 1: Edge -->
  <text x="500" y="50" font-family="Luminari, Papyrus, 'Times New Roman', serif" font-size="28" fill="#a0aabf" text-anchor="middle" letter-spacing="4" filter="url(#glow)">1. THE EDGE (Classroom)</text>
  
  <rect x="110" y="80" width="280" height="60" rx="10" fill="url(#nodeGrad)" stroke="#d4af37" stroke-width="2" filter="url(#boxShadow)" />
  <text x="250" y="115" font-family="'Courier New', monospace" font-size="18" fill="url(#goldText)" text-anchor="middle">📱 Student Phone</text>

  <rect x="610" y="80" width="280" height="60" rx="10" fill="url(#nodeGrad)" stroke="#d4af37" stroke-width="2" filter="url(#boxShadow)" />
  <text x="750" y="115" font-family="'Courier New', monospace" font-size="18" fill="url(#goldText)" text-anchor="middle">🎤 Professor's Device</text>

  <!-- Layer 2: Core -->
  <text x="500" y="240" font-family="Luminari, Papyrus, 'Times New Roman', serif" font-size="28" fill="#a0aabf" text-anchor="middle" letter-spacing="4" filter="url(#glow)">2. THE VAULT (On-Prem Server)</text>
  
  <rect x="300" y="300" width="300" height="60" rx="10" fill="url(#nodeGrad)" stroke="#d4af37" stroke-width="3" filter="url(#boxShadow)" />
  <text x="450" y="335" font-family="'Courier New', monospace" font-size="22" fill="url(#goldText)" text-anchor="middle" font-weight="bold">FastAPI Orchestrator</text>

  <rect x="660" y="300" width="280" height="60" rx="10" fill="url(#nodeGrad)" stroke="#849eff" stroke-width="2" filter="url(#boxShadow)" />
  <text x="800" y="335" font-family="'Courier New', monospace" font-size="18" fill="#c4d4ff" text-anchor="middle">bge-small Embedder</text>

  <rect x="120" y="450" width="360" height="70" rx="10" fill="url(#nodeGrad)" stroke="#849eff" stroke-width="3" filter="url(#boxShadow)" />
  <text x="300" y="480" font-family="'Courier New', monospace" font-size="20" fill="#c4d4ff" text-anchor="middle" font-weight="bold">Actian Vector Analytics</text>
  <text x="300" y="505" font-family="'Courier New', monospace" font-size="16" fill="#a0aabf" text-anchor="middle">(Columnar SQL Engine)</text>

  <rect x="520" y="450" width="360" height="70" rx="10" fill="url(#nodeGrad)" stroke="#849eff" stroke-width="3" filter="url(#boxShadow)" />
  <text x="700" y="480" font-family="'Courier New', monospace" font-size="20" fill="#c4d4ff" text-anchor="middle" font-weight="bold">Actian VectorAI DB</text>
  <text x="700" y="505" font-family="'Courier New', monospace" font-size="16" fill="#a0aabf" text-anchor="middle">(Semantic Retrieval)</text>

  <!-- Layer 3: Cloud -->
  <text x="500" y="590" font-family="Luminari, Papyrus, 'Times New Roman', serif" font-size="28" fill="#a0aabf" text-anchor="middle" letter-spacing="4" filter="url(#glow)">3. THE MAGIC (Cloud Generative)</text>

  <rect x="160" y="650" width="280" height="60" rx="10" fill="url(#nodeGrad)" stroke="#d4af37" stroke-width="2" filter="url(#boxShadow)" />
  <text x="300" y="685" font-family="'Courier New', monospace" font-size="20" fill="url(#goldText)" text-anchor="middle">Google Gemini API</text>

  <rect x="560" y="650" width="280" height="60" rx="10" fill="url(#nodeGrad)" stroke="#d4af37" stroke-width="2" filter="url(#boxShadow)" />
  <text x="700" y="685" font-family="'Courier New', monospace" font-size="20" fill="url(#goldText)" text-anchor="middle">ElevenLabs TTS</text>

  <!-- Layer 4: Dashboard -->
  <text x="500" y="750" font-family="Luminari, Papyrus, 'Times New Roman', serif" font-size="28" fill="#a0aabf" text-anchor="middle" letter-spacing="4" filter="url(#glow)">4. TEACHER DASHBOARD</text>

  <rect x="160" y="800" width="280" height="60" rx="10" fill="url(#nodeGrad)" stroke="#849eff" stroke-width="2" filter="url(#boxShadow)" />
  <text x="300" y="835" font-family="'Courier New', monospace" font-size="20" fill="#c4d4ff" text-anchor="middle">Marauder's Radar</text>

  <rect x="560" y="800" width="280" height="60" rx="10" fill="url(#nodeGrad)" stroke="#849eff" stroke-width="2" filter="url(#boxShadow)" />
  <text x="700" y="835" font-family="'Courier New', monospace" font-size="20" fill="#c4d4ff" text-anchor="middle">Pensieve Analytics</text>

</svg>
