<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a" />
      <stop offset="50%" stop-color="#141a30" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Node Gradient (Ancient Parchment/Gold) -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3b5c" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff4cd" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa7c11" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5" />
    </filter>

    <!-- Moving Sparkle for Data Paths -->
    <g id="dataSpark">
      <circle r="4" fill="#849eff" filter="url(#glow)">
        <animate attributeName="opacity" values="0.3; 1; 0.3" dur="1.5s" repeatCount="indefinite" />
        <animateTransform attributeName="transform" type="scale" values="0.8; 1.5; 0.8" dur="1s" repeatCount="indefinite" />
      </circle>
    </g>
  </defs>

  <rect width="800" height="700" fill="url(#bgGrad)" />

  <!-- Paths / Connections -->
  <g stroke="#3a4b7c" stroke-width="2" stroke-dasharray="6,4" fill="none" filter="url(#glow)" opacity="0.6">
    <!-- Edge to Orchestrator -->
    <path id="path1" d="M 400 180 L 400 300" />
    <!-- Phones to Edge -->
    <path id="path2" d="M 250 100 L 400 150" />
    <!-- Whisper to Edge -->
    <path id="path3" d="M 550 100 L 400 150" />
    
    <!-- Orchestrator to DBs -->
    <path id="path4" d="M 400 360 L 250 440" />
    <path id="path5" d="M 400 360 L 550 440" />
    
    <!-- Orchestrator to Cloud -->
    <path id="path6" d="M 400 360 L 400 560" />
  </g>

  <!-- Animated Data Packets along Paths -->
  <use href="#dataSpark">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 250 100 L 400 150" />
  </use>
  <use href="#dataSpark">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M 550 100 L 400 150" />
  </use>
  <use href="#dataSpark">
    <animateMotion dur="1.5s" repeatCount="indefinite" path="M 400 180 L 400 300" />
  </use>
  <use href="#dataSpark">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 400 360 L 250 440" />
  </use>
  <use href="#dataSpark">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 250 440 L 400 360" />
  </use>
  <use href="#dataSpark">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 400 360 L 400 560" />
  </use>

  <!-- Nodes -->
  <!-- Layer 1: Edge -->
  <text x="400" y="40" font-family="Luminari, Papyrus, 'Times New Roman', serif" font-size="24" fill="#a0aabf" text-anchor="middle" letter-spacing="3" filter="url(#glow)">THE EDGE (Classroom)</text>
  
  <rect x="150" y="70" width="200" height="60" rx="10" fill="url(#nodeGrad)" stroke="#d4af37" stroke-width="2" filter="url(#boxShadow)" />
  <text x="250" y="105" font-family="'Courier New', monospace" font-size="16" fill="url(#goldText)" text-anchor="middle">📱 Student Phones</text>

  <rect x="450" y="70" width="200" height="60" rx="10" fill="url(#nodeGrad)" stroke="#d4af37" stroke-width="2" filter="url(#boxShadow)" />
  <text x="550" y="105" font-family="'Courier New', monospace" font-size="16" fill="url(#goldText)" text-anchor="middle">🎤 Whisper.cpp (ASR)</text>

  <rect x="300" y="150" width="200" height="60" rx="10" fill="url(#nodeGrad)" stroke="#849eff" stroke-width="2" filter="url(#boxShadow)" />
  <text x="400" y="185" font-family="'Courier New', monospace" font-size="16" fill="#c4d4ff" text-anchor="middle">🍓 Capture Device</text>

  <!-- Layer 2: Core -->
  <text x="400" y="270" font-family="Luminari, Papyrus, 'Times New Roman', serif" font-size="24" fill="#a0aabf" text-anchor="middle" letter-spacing="3" filter="url(#glow)">THE VAULT (On-Prem Server)</text>
  
  <rect x="250" y="300" width="300" height="60" rx="10" fill="url(#nodeGrad)" stroke="#d4af37" stroke-width="3" filter="url(#boxShadow)" />
  <text x="400" y="335" font-family="'Courier New', monospace" font-size="20" fill="url(#goldText)" text-anchor="middle" font-weight="bold">FastAPI Orchestrator</text>

  <rect x="100" y="410" width="280" height="70" rx="10" fill="url(#nodeGrad)" stroke="#849eff" stroke-width="2" filter="url(#boxShadow)" />
  <text x="240" y="440" font-family="'Courier New', monospace" font-size="18" fill="#c4d4ff" text-anchor="middle">Actian VectorAI DB</text>
  <text x="240" y="465" font-family="'Courier New', monospace" font-size="14" fill="#a0aabf" text-anchor="middle">(Semantic Retrieval)</text>

  <rect x="420" y="410" width="280" height="70" rx="10" fill="url(#nodeGrad)" stroke="#849eff" stroke-width="2" filter="url(#boxShadow)" />
  <text x="560" y="440" font-family="'Courier New', monospace" font-size="18" fill="#c4d4ff" text-anchor="middle">Actian Vector SQL</text>
  <text x="560" y="465" font-family="'Courier New', monospace" font-size="14" fill="#a0aabf" text-anchor="middle">(Analytics Engine)</text>

  <!-- Layer 3: Cloud -->
  <text x="400" y="530" font-family="Luminari, Papyrus, 'Times New Roman', serif" font-size="24" fill="#a0aabf" text-anchor="middle" letter-spacing="3" filter="url(#glow)">THE MAGIC (Cloud Generative)</text>

  <rect x="150" y="560" width="220" height="80" rx="10" fill="url(#nodeGrad)" stroke="#d4af37" stroke-width="2" filter="url(#boxShadow)" />
  <text x="260" y="595" font-family="'Courier New', monospace" font-size="18" fill="url(#goldText)" text-anchor="middle">Google Gemini</text>
  <text x="260" y="620" font-family="'Courier New', monospace" font-size="14" fill="#a0aabf" text-anchor="middle">(Analogy Creator)</text>

  <rect x="430" y="560" width="220" height="80" rx="10" fill="url(#nodeGrad)" stroke="#d4af37" stroke-width="2" filter="url(#boxShadow)" />
  <text x="540" y="595" font-family="'Courier New', monospace" font-size="18" fill="url(#goldText)" text-anchor="middle">NVIDIA Llama 3.2</text>
  <text x="540" y="620" font-family="'Courier New', monospace" font-size="14" fill="#a0aabf" text-anchor="middle">(Vision Fallback)</text>
</svg>
