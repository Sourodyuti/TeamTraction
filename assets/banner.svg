<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <!-- Definitions for filters and gradients -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#181335" />
      <stop offset="100%" stop-color="#080c17" />
    </linearGradient>
    
    <!-- Gold Text Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff4cd" />
      <stop offset="30%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#aa7c11" />
      <stop offset="100%" stop-color="#f8e58c" />
    </linearGradient>

    <!-- 3D Bevel/Drop Shadow Filter -->
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.9" />
      <feDropShadow dx="1" dy="2" stdDeviation="1" flood-color="#000" flood-opacity="0.5" />
    </filter>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)" />
  
  <!-- Subtle Hogwarts-like silhouette lines in background -->
  <path d="M850,300 L850,180 L870,130 L890,180 L890,300 Z M900,300 L900,220 L910,190 L920,220 L920,300 Z M810,300 L810,200 L825,150 L840,200 L840,300 Z" fill="#000000" opacity="0.6" filter="url(#glow)"/>
  <path d="M250,300 L250,160 L270,110 L290,160 L290,300 Z M300,300 L300,200 L310,170 L320,200 L320,300 Z" fill="#000000" opacity="0.6" filter="url(#glow)"/>

  <!-- Sparkling Stars -->
  <g transform="translate(150, 80)">
      <path d="M0,-10 L2,-2 L10,0 L2,2 L0,10 L-2,2 L-10,0 L-2,-2 Z" fill="#ffffff" filter="url(#glow)">
        <animateTransform attributeName="transform" type="scale" values="0.1; 1; 0.1" dur="4s" repeatCount="indefinite" begin="0s" />
        <animate attributeName="opacity" values="0; 1; 0" dur="4s" repeatCount="indefinite" begin="0s" />
      </path>
  </g>
  <g transform="translate(850, 60)">
      <path d="M0,-10 L2,-2 L10,0 L2,2 L0,10 L-2,2 L-10,0 L-2,-2 Z" fill="#ffebaa" filter="url(#strongGlow)">
        <animateTransform attributeName="transform" type="scale" values="0.1; 1.5; 0.1" dur="3s" repeatCount="indefinite" begin="1.5s" />
        <animate attributeName="opacity" values="0; 0.8; 0" dur="3s" repeatCount="indefinite" begin="1.5s" />
      </path>
  </g>
  <g transform="translate(1050, 200)">
      <path d="M0,-8 L1.5,-1.5 L8,0 L1.5,1.5 L0,8 L-1.5,1.5 L-8,0 L-1.5,-1.5 Z" fill="#ffffff" filter="url(#glow)">
        <animateTransform attributeName="transform" type="scale" values="0.1; 0.8; 0.1" dur="5s" repeatCount="indefinite" begin="0.7s" />
        <animate attributeName="opacity" values="0; 1; 0" dur="5s" repeatCount="indefinite" begin="0.7s" />
      </path>
  </g>
  <g transform="translate(350, 240)">
      <path d="M0,-12 L2.5,-2.5 L12,0 L2.5,2.5 L0,12 L-2.5,2.5 L-12,0 L-2.5,-2.5 Z" fill="#c0cdff" filter="url(#strongGlow)">
        <animateTransform attributeName="transform" type="scale" values="0.1; 1.2; 0.1" dur="3.5s" repeatCount="indefinite" begin="2.1s" />
        <animate attributeName="opacity" values="0; 0.9; 0" dur="3.5s" repeatCount="indefinite" begin="2.1s" />
      </path>
  </g>
  <g transform="translate(80, 250)">
      <path d="M0,-10 L2,-2 L10,0 L2,2 L0,10 L-2,2 L-10,0 L-2,-2 Z" fill="#ffffff" filter="url(#glow)">
        <animateTransform attributeName="transform" type="scale" values="0.1; 0.9; 0.1" dur="4.2s" repeatCount="indefinite" begin="0.3s" />
        <animate attributeName="opacity" values="0; 0.7; 0" dur="4.2s" repeatCount="indefinite" begin="0.3s" />
      </path>
  </g>
  <g transform="translate(700, 110)">
      <path d="M0,-6 L1,-1 L6,0 L1,1 L0,6 L-1,1 L-6,0 L-1,-1 Z" fill="#ffffff" filter="url(#glow)">
        <animateTransform attributeName="transform" type="scale" values="0.1; 0.7; 0.1" dur="2.8s" repeatCount="indefinite" begin="1.1s" />
        <animate attributeName="opacity" values="0; 1; 0" dur="2.8s" repeatCount="indefinite" begin="1.1s" />
      </path>
  </g>

  <!-- Main 3D Text -->
  <!-- Shadow/Backplate layer for extreme depth -->
  <text x="600" y="165" font-family="'Times New Roman', Times, serif" font-size="100" font-weight="900" fill="#2a1e05" text-anchor="middle" filter="url(#shadow3d)" letter-spacing="6">
    LEGILIMENS
  </text>
  <!-- Foreground Gold Layer -->
  <text x="600" y="160" font-family="'Times New Roman', Times, serif" font-size="100" font-weight="900" fill="url(#gold)" text-anchor="middle" letter-spacing="6">
    LEGILIMENS
  </text>
  
  <text x="600" y="230" font-family="'Courier New', Courier, monospace" font-size="22" fill="#a0aabf" text-anchor="middle" letter-spacing="4" filter="url(#glow)">
    R E A L - T I M E   M I N D - R E A D I N G
  </text>
</svg>
